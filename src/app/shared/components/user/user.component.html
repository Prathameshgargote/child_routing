<div class="col">
  <div class="card">
    <div class="card-header">
      <h1>{{ userObj.userName }}</h1>
    </div>
    <div class="card-body">
      <p>User Role : {{ userObj.userRole }}</p>
    </div>
    <div class="card-footer d-flex justify-content-between">
      <button
        mat-raised-button
        color="primary"
        routerLink="edit"
        queryParamsHandling="preserve"
      >
        Edit
      </button>
      <button mat-raised-button color="warn" (click)="onRemove()">Remove</button>
    </div>
  </div>
</div>
