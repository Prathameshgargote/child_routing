<ng-container *ngIf="UserArr.length > 0; else NoUser">
  <div class="row">
    <div class="col-12 text-right mb-3">
      <button mat-raised-button color="primary" routerLink="add">
        Add User
      </button>
    </div>
    <div class="col-md-4">
      <ul class="list-group">
        <li
          [routerLink]="user.userId"
          [queryParams]="{ userRole: user.userRole }"
          *ngFor="let user of UserArr"
          [ngClass]="{
            active: user.userId === selectID
          }"
          (click)="onselect(user)"
          class="list-group-item"
        >
          {{ user.userName }}
        </li>
      </ul>
    </div>
    <div class="col-md-8">
      <router-outlet></router-outlet>
    </div>
  </div>
</ng-container>

<ng-template #NoUser>
  <p class="alert alert-info alert-sm">Not User Is Available</p>
</ng-template>
