<div class="col">
  <div class="card p-5">
    <form [formGroup]="userForm" (ngSubmit)="onsubmit()">
      <div class="form-group">
        <label for="UserName"> User Name</label>
        <input type="text" formControlName="userName" class="form-control" />
      </div>
      <div class="form-group">
        <label for="userRole"> User Role</label>
        <select type="text" formControlName="userRole" class="form-control">
          <option value="Candidate">Candidate</option>
          <option value="Admin">Admin</option>
          <option value="SuperAdmin">SuperAdmin</option>
        </select>
      </div>
      <button
        mat-raised-button
        color="primary"
        class="btn-block"
        *ngIf="!IsEditMode"
      >
        Add User
      </button>
      <button
        mat-raised-button
        color="primary"
        class="btn-block"
        *ngIf="IsEditMode"
        type="button"
        (click)="Onupdate()"
        [disabled]="disableval"
      >
        Update User
      </button>
    </form>
  </div>
</div>
